name: Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Build the Windows installer
        run: npm run tauri -- build --bundles msi

      - name: Upload the installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter *.msi)
          if ($files.Count -eq 0) {
            Write-Error "No .msi was produced."
            exit 1
          }
          gh release upload "${{ github.event.release.tag_name }}" $files.FullName --clobber
