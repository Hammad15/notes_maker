name: Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Build the Windows installer
        run: npm run tauri -- build --bundles msi

      - name: Upload the installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter *.msi)
          if ($files.Count -ne 1) {
            Write-Error "Expected one .msi."
            exit 1
          }
          $version = $env:RELEASE_TAG -replace '^[vV]', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "The release tag has no version."
            exit 1
          }
          $dest = Join-Path $files[0].DirectoryName "CreateNotes_V${version}_Windows_x64.msi"
          Copy-Item -LiteralPath $files[0].FullName -Destination $dest -Force
          gh release upload $env:RELEASE_TAG $dest --clobber
