name: macOS release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Apply the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.event.release.tag_name }}" --notes-file .github/RELEASE_TEMPLATE.md

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Build the unsigned disk image
        run: npm run tauri -- build --bundles dmg --no-sign

      - name: Upload the disk image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected one .dmg."
            exit 1
          fi
          version="${RELEASE_TAG#[vV]}"
          if [ -z "$version" ]; then
            echo "The release tag has no version."
            exit 1
          fi
          dest="src-tauri/target/release/bundle/dmg/CreateNotes_V${version}_Mac.dmg"
          cp "${files[0]}" "$dest"
          gh release upload "$RELEASE_TAG" "$dest" --clobber
